<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenSky – direkte test</title><style>body{font:16px system-ui;background:#101d2e;color:#f1f5fa;max-width:780px;margin:32px auto;padding:18px}button{padding:12px 18px;border:0;border-radius:7px;background:#3479ae;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1d3045;padding:16px;border-radius:7px}</style></head><body><h1>OpenSky – test direkte fra nettleseren</h1><p>Én forespørsel til OpenSky Network for området rundt Kristiansund. Dette endrer ikke flykartet. Nettleseren kan blokkere svaret på grunn av CORS.</p><button id="run">Test OpenSky nå</button><pre id="out">Ingen test kjørt.</pre><script>document.getElementById('run').onclick=async()=>{const b=document.getElementById('run'),o=document.getElementById('out');b.disabled=true;o.textContent='Kontakter OpenSky …';const started=Date.now();try{const r=await fetch('https://opensky-network.org/api/states/all?lamin=62.5&lomin=6.5&lamax=63.8&lomax=9.0',{cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(20000)});let output='HTTP-status: '+r.status+'\nTid: '+(Date.now()-started)+' ms';if(r.ok){const j=await r.json();output+='\nFlyposisjoner i området: '+(Array.isArray(j.states)?j.states.length:'ukjent')+'\nTidsstempel: '+(j.time||'ukjent');}else{output+='\nSvar: '+(await r.text()).slice(0,400);}o.textContent=output;}catch(e){o.textContent='Nettverks-/CORS-/timeout-feil: '+String(e.message||e)+'\nTid: '+(Date.now()-started)+' ms';}finally{b.disabled=false;}};</script></body></html>
