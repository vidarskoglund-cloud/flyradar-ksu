name: Deploy Flyradar KSU to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Avinor KSU traffic
        shell: python
        run: |
          import json, os, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          url = "https://asrv.avinor.no/XmlFeed/v1.0?TimeFrom=1&TimeTo=8&airport=KSU&serviceType=E"
          req = urllib.request.Request(url, headers={"User-Agent":"Flyradar-KSU/1.0"})
          flights = []
          try:
              with urllib.request.urlopen(req, timeout=12) as resp:
                  root = ET.fromstring(resp.read())
          except Exception as exc:
              # Avinor outages must not block publishing independent UI fixes.
              print("WARNING: Avinor feed unavailable; retaining existing schedule file:", exc)
              os.makedirs("data", exist_ok=True)
              if not os.path.isfile("data/avinor-ksu.json"):
                  with open("data/avinor-ksu.json","w",encoding="utf-8") as f:
                      json.dump({"generated_at": None, "flights": [], "status": "unavailable"}, f)
              raise SystemExit(0)
          for node in root.findall(".//flight"):
              item = {"uniqueId": node.attrib.get("uniqueId")}
              for child in list(node):
                  tag = child.tag.split("}")[-1]
                  if tag == "status":
                      item["status_code"] = child.attrib.get("code")
                      item["status_time"] = child.attrib.get("time")
                  else:
                      item[tag] = (child.text or "").strip()
              flights.append({
                  "uniqueId": item.get("uniqueId"),
                  "flight_id": item.get("flight_id") or item.get("flightId"),
                  "schedule_time": item.get("schedule_time"),
                  "arr_dep": item.get("arr_dep"),
                  "airport": item.get("airport"),
                  "airline": item.get("airline"),
                  "via_airport": item.get("via_airport"),
                  "status_code": item.get("status_code"),
                  "status_time": item.get("status_time")
              })
          flights.sort(key=lambda x: x.get("schedule_time") or "")
          os.makedirs("data", exist_ok=True)
          with open("data/avinor-ksu.json","w",encoding="utf-8") as f:
              json.dump({"generated_at": datetime.now(timezone.utc).isoformat(), "flights": flights}, f, ensure_ascii=False)

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
