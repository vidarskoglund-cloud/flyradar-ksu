name: Publish adsb.fi test snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adsb-fi-test-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch adsb.fi snapshot
        run: python3 tools/publish_adsb_fi_test.py
      - name: Commit test JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/adsb-fi-test.json
          if ! git diff --cached --quiet; then
            git commit -m "Update adsb.fi manual test snapshot"
            git push
          fi
