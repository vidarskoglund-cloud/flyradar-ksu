name: Test adsb.fi connectivity

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-adsb-fi.yml"
      - "tools/test_adsb_fi.py"

permissions:
  contents: read

jobs:
  test-adsb-fi:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test adsb.fi v3 from GitHub runner
        run: python3 tools/test_adsb_fi.py
      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adsb-fi-diagnostic
          path: adsb-fi-diagnostic.json
          retention-days: 7
