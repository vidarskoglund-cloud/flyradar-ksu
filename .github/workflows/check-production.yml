name: Check deployed Flyradar KSU
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "worker/src/index.js"
      - "index.html"
      - ".github/workflows/check-production.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare Worker health and aircraft response
        shell: python
        run: |
          import json, time, urllib.request, urllib.error
          base = "https://flyradar-ksu.vidar-skoglund.workers.dev"
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(base + "/health", timeout=20) as response:
                      health = json.load(response)
                  if health.get("version") == "rebuild-v1":
                      print("Deployed new Worker:", health)
                      break
                  print("Waiting for new Worker:", health)
              except Exception as error:
                  print("Health attempt", attempt + 1, str(error))
              time.sleep(20)
          else:
              raise SystemExit("New Worker not detected after deployment wait")
          try:
              with urllib.request.urlopen(base + "/aircraft", timeout=35) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit("Aircraft endpoint HTTP " + str(error.code))
          for key in ("ok", "stale", "ac", "sources", "age_seconds"):
              assert key in payload, "Missing key " + key
          assert isinstance(payload["ac"], list)
          print("Aircraft API structure OK. Fresh:", payload["ok"], "stale:", payload["stale"], "count:", len(payload["ac"]))
          print("Sources:", json.dumps(payload["sources"]))
          if not payload["ok"]:
              print("Upstream sources unavailable; Worker API is responding safely.")
