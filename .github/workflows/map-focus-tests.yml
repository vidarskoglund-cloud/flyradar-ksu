name: Map focus regression tests
on:
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'admin.html'
      - 'admin.js'
      - 'aircraft-photos.js'
      - 'vessel-photos.js'
      - 'vessel-wikidata.js'
      - 'speedboat-schedule.js'
      - 'worker/src/index.js'
      - 'tests/**'
      - '.github/workflows/map-focus-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check admin.js
          node --check flightaware-status.js
          node --check aircraft-photos.js
          node --check vessel-photos.js
          node --check vessel-wikidata.js
          node --check speedboat-schedule.js
          node --check worker/src/index.js
      - name: New map focus regression tests
        run: node --test tests/map-focus.test.cjs
      - name: Image identification and cache tests
        run: node --test tests/photos.test.cjs
      - name: Vessel panel rendering and selection tests
        run: node --test tests/vessel-panel.test.cjs
      - name: Flight status and conditional map button tests
        run: node --test tests/flight-status-button.test.cjs
      - name: Free 25 NM route pilot and cost safety tests
        run: node --test tests/route25-pilot.test.cjs
      - name: Admin data sources and priority flow tests
        run: node --test tests/admin-source-flow.test.cjs
      - name: Vessel movement and budget copy tests
        run: node --test tests/vessel-context-budget-copy.test.cjs
      - name: Wikidata vessel facts and identity tests
        run: node --test tests/vessel-wikidata.test.cjs
      - name: Desktop compact status layout tests
        run: node --test tests/compact-desktop-stats.test.cjs
      - name: Desktop viewport fit tests
        run: node --test tests/desktop-viewport-fit.test.cjs
      - name: Avinor next flights labels and timing tests
        run: node --test tests/avinor-schedule-clarity.test.cjs
      - name: Focused aircraft auto-fit tests
        run: node --test tests/focused-aircraft-auto-map.test.cjs
      - name: Header actual map focus tests
        run: node --test tests/header-map-focus.test.cjs
      - name: Aircraft route card copy tests
        run: node --test tests/aircraft-route-card-copy.test.cjs
      - name: Kristiansund speedboat departures and arrivals tests
        run: node --test tests/speedboat-schedule.test.cjs
      - name: Specialized aircraft classification and type photo tests
        run: node --test tests/aircraft-special-photo.test.cjs
      - name: Existing motion regression tests (known baseline failures)
        continue-on-error: true
        run: node --test tests/motion.test.cjs
