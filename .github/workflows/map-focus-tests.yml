name: Map focus regression tests
on:
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'aircraft-photos.js'
      - 'vessel-photos.js'
      - 'worker/src/index.js'
      - 'tests/**'
      - '.github/workflows/map-focus-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check aircraft-photos.js
          node --check vessel-photos.js
          node --check worker/src/index.js
      - name: New map focus regression tests
        run: node --test tests/map-focus.test.cjs
      - name: Image identification and cache tests
        run: node --test tests/photos.test.cjs
      - name: Vessel panel rendering and selection tests
        run: node --test tests/vessel-panel.test.cjs
      - name: Existing motion regression tests (known baseline failures)
        continue-on-error: true
        run: node --test tests/motion.test.cjs
