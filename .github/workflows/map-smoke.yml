name: Map regression smoke tests

on:
  pull_request:
    paths:
      - "app.js"
      - "admin.html"
      - "analytics/**"
      - "tests/web-analytics.test.cjs"
      - "worker/src/index.js"
      - "tests/worker-route-diagnostics.test.cjs"
      - "index.html"
      - "map/**"
      - "aircraft/**"
      - "tests/focused-aircraft-auto-map.test.cjs"
      - "tests/traffic-notice-utils.test.cjs"
      - "tests/aircraft-track-history.test.cjs"
      - "tests/aircraft-route-cache.test.cjs"
      - "tests/aircraft-auto-route-eligibility.test.cjs"
      - "tests/remote-ksu-origin-tracking.test.cjs"
      - "tests/remote-ksu-ground-taxiing.test.cjs"
      - "tests/ksu-turnaround-callsign.test.cjs"
      - "tests/featured-fast-ferry.test.cjs"
      - "tests/kystekspressen-ais.test.cjs"
      - "tests/map-focus-geometry.test.cjs"
      - "tests/map-aircraft-focus-priority.test.cjs"
      - "tests/map-focus-target.test.cjs"
      - "tests/map-focus-motion-decision.test.cjs"
      - ".github/workflows/map-smoke.yml"
  push:
    branches: [main]
    paths:
      - "app.js"
      - "admin.html"
      - "analytics/**"
      - "tests/web-analytics.test.cjs"
      - "worker/src/index.js"
      - "tests/worker-route-diagnostics.test.cjs"
      - "index.html"
      - "map/**"
      - "aircraft/**"
      - "tests/focused-aircraft-auto-map.test.cjs"
      - "tests/traffic-notice-utils.test.cjs"
      - "tests/aircraft-track-history.test.cjs"
      - "tests/aircraft-route-cache.test.cjs"
      - "tests/aircraft-auto-route-eligibility.test.cjs"
      - "tests/remote-ksu-origin-tracking.test.cjs"
      - "tests/remote-ksu-ground-taxiing.test.cjs"
      - "tests/ksu-turnaround-callsign.test.cjs"
      - "tests/featured-fast-ferry.test.cjs"
      - "tests/kystekspressen-ais.test.cjs"
      - "tests/map-focus-geometry.test.cjs"
      - "tests/map-aircraft-focus-priority.test.cjs"
      - "tests/map-focus-target.test.cjs"
      - "tests/map-focus-motion-decision.test.cjs"
      - ".github/workflows/map-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check analytics/config.js
          node --check analytics/beacon.js
          node --check analytics/owner-control.js
          node --check map/traffic-notice-utils.js
          node --check map/focus-geometry.js
          node --check map/aircraft-focus-priority.js
          node --check map/focus-target.js
          node --check map/focus-motion-decision.js
          node --check aircraft/track-history.js
          node --check aircraft/route-cache.js
          node --check aircraft/auto-route-eligibility.js
      - name: Test focused aircraft and map traffic notices
        run: node --test tests/web-analytics.test.cjs tests/focused-aircraft-auto-map.test.cjs tests/traffic-notice-utils.test.cjs tests/aircraft-track-history.test.cjs tests/aircraft-route-cache.test.cjs tests/aircraft-auto-route-eligibility.test.cjs tests/remote-ksu-origin-tracking.test.cjs tests/remote-ksu-ground-taxiing.test.cjs tests/ksu-turnaround-callsign.test.cjs tests/featured-fast-ferry.test.cjs tests/kystekspressen-ais.test.cjs tests/map-focus-geometry.test.cjs tests/map-aircraft-focus-priority.test.cjs tests/map-focus-target.test.cjs tests/map-focus-motion-decision.test.cjs tests/worker-route-diagnostics.test.cjs
