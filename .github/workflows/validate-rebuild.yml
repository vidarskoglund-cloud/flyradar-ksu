name: Validate Flyradar KSU rebuild
on:
  pull_request:
    paths:
      - "index.html"
      - "worker/**"
      - ".github/workflows/validate-rebuild.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker syntax
        run: node --check worker/src/index.js
      - name: Check inline browser script syntax
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m=>m[1]).filter(Boolean);
          if(!scripts.length)throw Error('No inline script found');
          for(const s of scripts)new Function(s);
          console.log('Validated '+scripts.length+' inline script(s)');
          NODE
      - name: Validate Worker deployment configuration
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const raw=fs.readFileSync('worker/wrangler.jsonc','utf8');
          const c=JSON.parse(raw);
          if(c.name!=='flyradar-ksu'||c.main!=='src/index.js')throw Error('Worker identity changed');
          if(!c.durable_objects.bindings.some(b=>b.name==='TRACK_STORE'&&b.class_name==='TrackStore'))throw Error('Durable Object binding missing');
          console.log('Worker identity and TRACK_STORE binding preserved');
          NODE
