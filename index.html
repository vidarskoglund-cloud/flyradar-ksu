<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flyradar KSU</title><meta name="theme-color" content="#081321">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{font-family:system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#081321;color:#eef5fc}
header{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:15px 20px;border-bottom:1px solid #263b50}h1{font-size:22px;margin:0}
main{max-width:1280px;margin:auto;padding:14px}.muted{color:#9fb3c7;font-size:13px}.status{font-size:14px;font-weight:600}
#map{height:min(68vh,750px);min-height:420px;border:1px solid #28445c;border-radius:14px;overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}
button{border:1px solid #35566d;background:#12283c;color:white;border-radius:9px;padding:10px 14px;cursor:pointer}
#flights{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.flight{padding:14px;border-radius:12px;border:1px solid #28445c;background:#112336}.flight strong{font-size:18px}
.warning{color:#ffce77}.good{color:#78e5b0}.bad{color:#ff8b8b}
.leaflet-container{background:#142536}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#13283b;color:white}
</style></head><body>
<header><div><h1>Flyradar KSU</h1><div class="muted">Flytrafikk ved Kristiansund lufthavn, Kvernberget</div></div><div id="status" class="status">Kobler til …</div></header>
<main><div class="bar"><div id="summary" class="muted">Henter flyposisjoner</div><button id="center">Vis Kvernberget</button></div>
<div id="map" aria-label="Kart over flytrafikk"></div><div id="flights"></div>
<p class="muted">Posisjonene kommer fra eksterne ADS-B-kilder og kan være forsinket. Ikke bruk kartet til navigasjon.</p></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API="https://flyradar-ksu.vidar-skoglund.workers.dev/aircraft";
const KSU=[63.1118,7.8245],map=L.map("map").setView(KSU,9);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap",maxZoom:18}).addTo(map);
L.circleMarker(KSU,{radius:7,color:"#fff",fillColor:"#58c7ff",fillOpacity:1}).addTo(map).bindPopup("Kristiansund lufthavn (KSU)");
const markers=L.layerGroup().addTo(map);
document.getElementById("center").onclick=()=>map.setView(KSU,9);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nm=(a,b)=>{const rad=Math.PI/180,p1=KSU[0]*rad,p2=a*rad,d=(a-KSU[0])*rad,l=(b-KSU[1])*rad,h=Math.sin(d/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(l/2)**2;return 3440.065*2*Math.asin(Math.sqrt(h));};
async function refresh(){
 const status=document.getElementById("status"),summary=document.getElementById("summary"),flights=document.getElementById("flights");
 try{
  let data=null,fromSnapshot=false;
  try{
   const r=await fetch(API,{cache:"no-store"});if(r.ok)data=await r.json();
  }catch(e){console.warn("Worker unavailable",e);}
  if(!data?.ok){
   try{
    const r=await fetch("./data/adsb-fi-test.json",{cache:"no-store"});
    if(r.ok){
     const snapshot=await r.json(),age=(Date.now()-Date.parse(snapshot.fetched_at))/1000;
     if(Number.isFinite(age)&&age>=0&&age<=1200&&Array.isArray(snapshot.ac)){
      data={ok:false,stale:true,age_seconds:age,ac:snapshot.ac};
      fromSnapshot=true;
     }
    }
   }catch(e){console.warn("Snapshot unavailable",e);}
  }
  if(!data)throw Error("Ingen tilgjengelige datakilder");
  const stale=Boolean(data.stale),live=Boolean(data.ok&&!stale);
  status.textContent=live?"Direkte flydata":fromSnapshot?"Forsinket flydata (GitHub)":stale?"Historiske posisjoner":"Ingen tilgjengelige flydata";
  status.className="status "+(live?"good":stale?"warning":"bad");
  const ac=Array.isArray(data.ac)?data.ac:[];
  summary.textContent=(live?"Oppdatert nå":stale?"Posisjoner hentet for "+Math.round((data.age_seconds||0)/60)+" min siden":"Kildene er midlertidig utilgjengelige")+" · "+ac.length+" fly";
  markers.clearLayers();flights.replaceChildren();
  const sorted=ac.filter(a=>Number.isFinite(+a.lat)&&Number.isFinite(+a.lon)).map(a=>({...a,d:nm(+a.lat,+a.lon)})).sort((a,b)=>a.d-b.d);
  for(const a of sorted){
   const name=esc(a.flight||a.r||a.hex||"Ukjent fly"),distance=a.d.toFixed(1),alt=esc(a.alt_baro??a.alt_geom??"–");
   L.circleMarker([+a.lat,+a.lon],{radius:7,color:stale?"#e8af59":"#56e7a2",fillOpacity:.8}).addTo(markers).bindPopup("<b>"+name+"</b><p>"+distance+" NM fra KSU · "+alt+" ft"+(stale?" · historisk":"")+"</p>");
   const card=document.createElement("div");card.className="flight";card.innerHTML="<strong>"+name+"</strong><div class='muted'>"+distance+" NM fra KSU · "+alt+" ft</div>"+(stale?"<div class='warning'>Historisk posisjon</div>":"");flights.append(card);
  }
  if(!sorted.length)flights.textContent="Ingen flyposisjoner tilgjengelig.";
 }catch(e){status.textContent="Tilkoblingsfeil";status.className="status bad";summary.textContent=String(e.message||e);markers.clearLayers();flights.textContent="Kan ikke hente flydata akkurat nå.";}
}
refresh();setInterval(refresh,60000);
</script></body></html>
