<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>Flyradar KSU</title>
<style>
:root{--bg:#08111f;--p:#0f1b2d;--line:#203753;--t:#f4f7fb;--m:#8fa4bb;--a:#6ee7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#08111fee;z-index:999}
h1{font-size:22px;margin:0}.muted{color:var(--m);font-size:12px}.ok{color:#59d98e}.err{color:#ff7777}
main{max-width:1200px;margin:auto;padding:14px}.controls{display:grid;grid-template-columns:140px 1fr auto auto;gap:8px;margin-bottom:10px}
input,select,button{min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--p);color:var(--t);padding:0 10px;font:inherit}
button{font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.stats div{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:10px}.stats b{display:block;font-size:20px}
#map{height:48vh;min-height:320px;border-radius:14px;border:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;margin-top:10px}.card{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:12px}.top{display:flex;justify-content:space-between}.call{font-size:18px;font-weight:800}.dist{color:var(--a);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.grid span{display:block;color:var(--m);font-size:9px}.grid b{font-size:12px}
.hero{display:none;background:linear-gradient(135deg,#0d1b2e,#143357);border:1px solid #2d557c;border-radius:18px;padding:24px;margin-bottom:10px}.hero.on{display:block}.hero .call{font-size:46px}.hero .grid b{font-size:24px}.hidden{display:none}
footer{color:var(--m);font-size:11px;padding:14px;max-width:1200px;margin:auto}
@media(max-width:700px){.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div><h1>Flyradar KSU</h1><div class="muted">Kristiansund / Kvernberget</div></div><div id="status" class="muted">Starter…</div></header>
<main>
<div class="controls">
<select id="radius"><option value="25">25 NM</option><option value="50" selected>50 NM</option><option value="100">100 NM</option><option value="150">150 NM</option></select>
<input id="filter" placeholder="Søk: SAS, NAX, LN-…, callsign">
<button id="refresh">Oppdater</button><button id="mode">Displaymodus</button>
</div>
<div class="stats"><div><b id="count">0</b><span class="muted">fly</span></div><div><b id="closest">–</b><span class="muted">nærmest</span></div><div><b id="updated">–</b><span class="muted">oppdatert</span></div></div>
<section id="hero" class="hero"><div class="top"><div><div id="hcall" class="call">Ingen fly</div><div id="hmeta" class="muted">–</div></div><div id="hdist" class="dist">–</div></div>
<div class="grid"><div><span>HØYDE</span><b id="halt">–</b></div><div><span>FART</span><b id="hspd">–</b></div><div><span>KURS</span><b id="htrk">–</b></div><div><span>VERTIKAL</span><b id="hvr">–</b></div></div></section>
<div id="map"></div><div id="cards" class="cards"></div>
<details style="margin-top:12px"><summary>Innstillinger</summary><div class="controls" style="margin-top:10px">
<input id="lat" value="63.1118" type="number" step=".0001"><input id="lon" value="7.8245" type="number" step=".0001"><button id="save">Lagre</button></div></details>
</main>
<footer>Flydata: adsb.lol (ODbL 1.0), hentet via cors.dev. Kart © OpenStreetMap-bidragsytere.</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
window.addEventListener('error',e=>{
  const s=document.getElementById('status');
  if(s){s.textContent='JS-feil: '+e.message;s.className='err'}
});
</script>
<script src="app.js?v=4"></script>
</body></html>
